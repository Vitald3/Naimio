      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: action, in: path, required: true, schema: { type: string, enum: [resolve, reconcile] } }, { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 160 } }]
      responses: { '200': { description: Audited resolution or idempotent provider reconciliation }, '403': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '503': { $ref: '#/components/responses/Error' } }
  /payments/provider/sandbox/webhook:
    post:
      operationId: sandboxSafeDealWebhook
      parameters: [{ name: X-Sandbox-Timestamp, in: header, required: true, schema: { type: string } }, { name: X-Sandbox-Signature, in: header, required: true, schema: { type: string } }]
      responses: { '204': { description: Verified and replay-safe provider event }, '403': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
components:
  schemas:
    CompanyWrite:
      type: object
      required: [name, slug]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 180 }
        slug: { type: string, minLength: 1, maxLength: 220, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        website: { type: string, format: uri, maxLength: 2048 }
        description: { type: string, maxLength: 4000 }
    JobEmploymentType:
      type: string
      enum: [FULL_TIME, PART_TIME, CONTRACT, INTERNSHIP]
    JobExperienceLevel:
      type: string
      enum: [JUNIOR, MIDDLE, SENIOR, LEAD, ANY]
    VacancyWrite:
      type: object
      additionalProperties: false
      required: [title, slug, description, employment_type, currency, remote]
      properties:
        company_id: { type: string, format: uuid, nullable: true }
        category_id: { type: string, format: uuid, nullable: true }
        title: { type: string, minLength: 1, maxLength: 200 }
        slug: { type: string, minLength: 1, maxLength: 240, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        description: { type: string, minLength: 1, maxLength: 20000 }
        employment_type: { $ref: '#/components/schemas/JobEmploymentType' }
        salary_min_kopecks: { type: integer, format: int64, minimum: 1, nullable: true }
        salary_max_kopecks: { type: integer, format: int64, minimum: 1, nullable: true }
        currency: { type: string, enum: [RUB] }
        location: { type: string, maxLength: 160 }
        remote: { type: boolean }
        experience_level: { $ref: '#/components/schemas/JobExperienceLevel' }
        skill_ids: { type: array, uniqueItems: true, maxItems: 30, items: { type: string, format: uuid } }
    JobApplicationWrite:
      type: object
      additionalProperties: false
      properties:
        cover_message: { type: string, maxLength: 5000 }
    VacancyPatch:
      type: object
      additionalProperties: false
      properties:
        company_id: { type: string, format: uuid, nullable: true }
        category_id: { type: string, format: uuid, nullable: true }
        title: { type: string, minLength: 1, maxLength: 200 }
        slug: { type: string, minLength: 1, maxLength: 240, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        description: { type: string, minLength: 1, maxLength: 20000 }
        employment_type: { $ref: '#/components/schemas/JobEmploymentType' }
        salary_min_kopecks: { type: integer, format: int64, minimum: 1, nullable: true }
        salary_max_kopecks: { type: integer, format: int64, minimum: 1, nullable: true }
        currency: { type: string, enum: [RUB] }
        location: { type: string, maxLength: 160 }
        remote: { type: boolean }
        experience_level: { $ref: '#/components/schemas/JobExperienceLevel' }
        skill_ids: { type: array, uniqueItems: true, maxItems: 30, items: { type: string, format: uuid } }
    VacancyModeration:
      type: object
      required: [action, reason]
      additionalProperties: false
      properties:
        action: { type: string, enum: [HIDE, RESTORE] }
        reason: { type: string, minLength: 3, maxLength: 1000 }
    MatchingConstraints:
      type: object
      additionalProperties: false
      properties:
        require_immediate_availability: { type: boolean, default: false }
        require_category_match: { type: boolean, default: false }
        max_minimum_order_kopecks: { type: integer, format: int64, minimum: 0 }
    MatchingEvent:
      type: object
      required: [run_id, freelancer_user_id, event_type]
      additionalProperties: false
      properties:
        run_id: { type: string, format: uuid }
        freelancer_user_id: { type: string, format: uuid }
        event_type: { type: string, enum: [IMPRESSION, PROFILE_OPEN, INVITE, SHORTLIST, PROPOSAL, ACCEPTANCE, COMPLETED, REPEAT] }
    ManualRecommendation:
      type: object
      required: [freelancer_user_id, internal_reason]
      additionalProperties: false
      properties:
        freelancer_user_id: { type: string, format: uuid }
        internal_reason: { type: string, minLength: 3, maxLength: 1000 }
    ProjectDraftWrite:
      type: object
      additionalProperties: false
      properties:
        source_type: { type: string, enum: [AI_BRIEF, IMPORT, COMMERCIAL_OFFER, CALCULATOR, MANUAL] }
        raw_input: { type: object, maxProperties: 20, additionalProperties: true }
        normalized_data: { type: object, maxProperties: 30, additionalProperties: true }
    AcquisitionAttribution:
      type: object
      additionalProperties: false
      properties:
        anonymous_id: { type: string, format: uuid }
        landing_path: { type: string, maxLength: 500, pattern: '^/' }
        utm_source: { type: string, maxLength: 200 }
        utm_medium: { type: string, maxLength: 200 }
        utm_campaign: { type: string, maxLength: 200 }
        utm_content: { type: string, maxLength: 200 }
        referral_code: { type: string, maxLength: 200 }
    CalculatorEstimateInput:
      type: object
      required: [answers, attribution]
      additionalProperties: false
      properties:
        answers: { type: object, maxProperties: 20, additionalProperties: true }
        attribution: { $ref: '#/components/schemas/AcquisitionAttribution' }
    CalculatorOption:
      type: object
      required: [value, label]
      additionalProperties: false
      properties:
        value: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
        label: { type: string, minLength: 1, maxLength: 200 }
    CalculatorQuestion:
      type: object
      required: [key, label, type, required]
      additionalProperties: false
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
        label: { type: string, minLength: 1, maxLength: 200 }
        type: { type: string, enum: [SELECT, NUMBER, BOOLEAN] }
        required: { type: boolean }
        min: { type: integer, minimum: 0 }
        max: { type: integer, minimum: 0 }
        options: { type: array, maxItems: 30, items: { $ref: '#/components/schemas/CalculatorOption' } }
    CalculatorPricing:
      type: object
      required: [baseline_min_kopecks, baseline_max_kopecks, duration_min_days, duration_max_days, option_basis_points, number_basis_points, boolean_basis_points, category_slug, skill_slugs, assumptions]
      additionalProperties: false
      properties:
        baseline_min_kopecks: { type: integer, format: int64, minimum: 100 }
        baseline_max_kopecks: { type: integer, format: int64, minimum: 100, maximum: 10000000000 }
        duration_min_days: { type: integer, minimum: 1, maximum: 3650 }
        duration_max_days: { type: integer, minimum: 1, maximum: 3650 }
        option_basis_points: { type: object, additionalProperties: { type: object, additionalProperties: { type: integer, minimum: 0, maximum: 50000 } } }
        number_basis_points: { type: object, additionalProperties: { type: integer, minimum: 0, maximum: 10000 } }
        boolean_basis_points: { type: object, additionalProperties: { type: integer, minimum: 0, maximum: 50000 } }
        category_slug: { type: string, maxLength: 160 }
        skill_slugs: { type: array, maxItems: 30, items: { type: string, maxLength: 160 } }
        assumptions: { type: array, maxItems: 20, items: { type: string, maxLength: 500 } }
    AdminCalculatorInput:
      type: object
      required: [slug, title, intro, enabled, questions, pricing, reason]
      additionalProperties: false
      properties:
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 160 }
        title: { type: string, minLength: 1, maxLength: 220 }
        intro: { type: string, minLength: 1, maxLength: 600 }
        enabled: { type: boolean }
        questions: { type: array, minItems: 1, maxItems: 20, items: { $ref: '#/components/schemas/CalculatorQuestion' } }
        pricing: { $ref: '#/components/schemas/CalculatorPricing' }
        reason: { type: string, minLength: 3, maxLength: 500 }
    AcquisitionEvent:
      allOf:
        - { $ref: '#/components/schemas/AcquisitionAttribution' }
        - type: object
          required: [event_type]
          properties:
            event_type: { type: string, enum: [LANDING_VIEW, HOMEPAGE_TASK_STARTED, GUEST_PROJECT_ANALYSIS_COMPLETED, CALCULATOR_STARTED, CALCULATOR_COMPLETED, COMMERCIAL_OFFER_ANALYZED, REGISTRATION_COMPLETED, PROJECT_DRAFT_CLAIMED, PROJECT_PUBLISHED, PROPOSAL_RECEIVED, PROPOSAL_ACCEPTED, PROJECT_COMPLETED] }
            metadata: { type: object, maxProperties: 5, additionalProperties: { type: string, maxLength: 160 } }
    SafeDealEvidenceInput:
      type: object
      required: [kind, body]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [COMMENT, MESSAGE_REFERENCE, SUBMISSION_REFERENCE] }
        body: { type: string, minLength: 1, maxLength: 5000 }
        reference_id: { type: string, format: uuid }
    AIProjectInput:
      type: object
      required: [draft_token]
      additionalProperties: false
      properties:
        draft_token: { type: string, minLength: 64, maxLength: 64 }
        text: { type: string, minLength: 3, maxLength: 50000 }
        goal: { type: string, maxLength: 2000 }
        materials:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [text]
            additionalProperties: false
            properties: { name: { type: string, maxLength: 200 }, text: { type: string, minLength: 3, maxLength: 50000 } }
        category_slug: { type: string, maxLength: 120 }
        skill_slugs: { type: array, maxItems: 30, items: { type: string, maxLength: 120 } }
        features: { type: array, maxItems: 30, items: { type: string, maxLength: 160 } }
    InviteCreate:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type: { type: string, enum: [CUSTOMER, FREELANCER, PROJECT] }
        project_id: { type: string, format: uuid }
        intended_email: { type: string, format: email, maxLength: 320 }
    ReferralRuleWrite:
      type: object
      required: [code, event_type, beneficiary, reward_type, reward_value, reward_unit, enabled, config]
      additionalProperties: false
      properties:
        code: { type: string, pattern: '^[A-Z0-9_]+$', maxLength: 100 }
        event_type: { type: string, enum: [INVITE_ACCEPTED] }
        beneficiary: { type: string, enum: [INVITER, INVITED] }
        reward_type: { type: string, enum: [COMMISSION_DISCOUNT, BONUS, FIXED_REWARD, PERCENT_REWARD] }
        reward_value: { type: integer, format: int64, minimum: 1 }
        reward_unit: { type: string, enum: [KOPECKS, BASIS_POINTS, COUNT, CREDITS] }
        max_uses: { type: integer, minimum: 1 }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        enabled: { type: boolean }
        config: { type: object }
    TeamMemberWrite:
      type: object
      additionalProperties: false
      properties:
        label: { type: string, maxLength: 120 }
        notes: { type: string, maxLength: 2000 }
    ConversationCreate:
      type: object
      additionalProperties: false
      properties:
        participant_user_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
    MessageCreate:
      type: object
      required: [client_message_id, type]
      additionalProperties: false
      properties:
        client_message_id: { type: string, format: uuid }
        type: { type: string, enum: [TEXT, IMAGE, FILE] }
        body: { type: string, maxLength: 10000 }
        reply_to_message_id: { type: string, format: uuid }
        reply_quote: { type: string, maxLength: 1000 }
        media_ids: { type: array, maxItems: 5, uniqueItems: true, items: { type: string, format: uuid } }
    CategoryWrite:
      type: object
      required: [slug, name, sort_order, is_active]
      additionalProperties: false
      properties:
        parent_id: { type: string, format: uuid, nullable: true }
        slug: { type: string, minLength: 1, maxLength: 120, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, maxLength: 2000 }
        sort_order: { type: integer, minimum: 0, maximum: 10000 }
        is_active: { type: boolean }
    SkillWrite:
      type: object
      required: [slug, name, is_active]
      additionalProperties: false
      properties:
        slug: { type: string, minLength: 1, maxLength: 120, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        name: { type: string, minLength: 1, maxLength: 160 }
        is_active: { type: boolean }
    ProposalWrite:
      type: object
      required: [message, currency]
      additionalProperties: false
      properties:
        message: { type: string, minLength: 1, maxLength: 5000 }
        price_kopecks: { type: integer, format: int64, minimum: 1, nullable: true }
        currency: { type: string, enum: [RUB] }
        delivery_days: { type: integer, minimum: 1, maximum: 3650, nullable: true }
    Health:
      type: object
      required: [status]
      properties: { status: { type: string, example: ok } }
    RegisterRequest:
      type: object
      required: [email, password, display_name, account_type]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 10, maxLength: 128, format: password }
        display_name: { type: string, minLength: 1, maxLength: 120 }
        account_type: { type: string, enum: [CUSTOMER, FREELANCER] }
    ProfessionalProfileUpdate:
      type: object
      required: [availability, profile_visibility]
      additionalProperties: false
      properties:
        professional_title: { type: string, maxLength: 160 }
        bio: { type: string, maxLength: 5000 }
        location_text: { type: string, maxLength: 160 }
        country_code: { type: string, pattern: '^[A-Z]{2}$' }
        experience_years: { type: integer, minimum: 0, maximum: 80, nullable: true }
        hourly_rate_kopecks: { type: integer, format: int64, minimum: 0, nullable: true }
        minimum_order_kopecks: { type: integer, format: int64, minimum: 0, nullable: true }
        availability: { type: string, enum: [AVAILABLE, PARTIALLY_BUSY, BUSY, UNAVAILABLE] }
        profile_visibility: { type: string, enum: [PUBLIC, PRIVATE] }
        categories:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/ProfileCategorySelection' }
        skills:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ProfileSkillSelection' }
        languages:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/ProfileLanguage' }
    ExternalReputationCreate:
      type: object
      required: [platform, profile_url]
      additionalProperties: false
      properties:
        platform: { type: string, enum: [KWORK, FL_RU, GITHUB, BEHANCE, DRIBBBLE, HABR_CAREER, OTHER] }
        profile_url: { type: string, format: uri, maxLength: 2048 }
        external_username: { type: string, maxLength: 160 }
    ExternalReputationPatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        platform: { type: string, enum: [KWORK, FL_RU, GITHUB, BEHANCE, DRIBBBLE, HABR_CAREER, OTHER] }
        profile_url: { type: string, format: uri, maxLength: 2048 }
        external_username: { type: string, maxLength: 160 }
    PublicExternalReputation:
      type: object
      required: [platform, display_name, profile_url, verified]
      additionalProperties: false
      properties:
        platform: { type: string }
        display_name: { type: string }
        profile_url: { type: string, format: uri }
        verified: { type: boolean, enum: [true] }
        rating: { type: number, nullable: true }
        reviews_count: { type: integer, minimum: 0, nullable: true }
        completed_orders_count: { type: integer, minimum: 0, nullable: true }
        account_since: { type: string, format: date, nullable: true }
        verified_at: { type: string, format: date-time, nullable: true }
    ReputationVerificationStart:
      type: object
      required: [method]
      additionalProperties: false
      properties:
        method: { type: string, enum: [PROFILE_CODE, MANUAL] }
        evidence: { type: object, maxProperties: 10, additionalProperties: true }
    ReputationDecision:
      type: object
      additionalProperties: false
      properties:
        reason_code: { type: string, enum: [PROFILE_NOT_ACCESSIBLE, OWNERSHIP_NOT_PROVEN, METRICS_NOT_VERIFIABLE, PROFILE_MISMATCH, INVALID_EVIDENCE, OTHER] }
        note: { type: string, maxLength: 2000 }
    ReviewCreate:
      type: object
      required: [rating_overall, dimensions]
      additionalProperties: false
      properties:
        rating_overall: { type: integer, minimum: 1, maximum: 5 }
        would_work_again: { type: boolean, nullable: true }
        text: { type: string, maxLength: 5000 }
        dimensions:
          type: object
          maxProperties: 4
          additionalProperties: { type: integer, minimum: 1, maximum: 5 }
    NativeTrustStats:
      type: object
      required: [reviews_count, completed_projects_count]
      additionalProperties: false
      properties:
        native_rating: { type: number, nullable: true }
        reviews_count: { type: integer, minimum: 0 }
        completed_projects_count: { type: integer, minimum: 0 }
        recommendation_rate: { type: number, minimum: 0, maximum: 100, nullable: true }
        updated_at: { type: string, format: date-time }
    ReviewReport:
      type: object
      required: [reason_code]
      additionalProperties: false
      properties:
        reason_code: { type: string, enum: [HARASSMENT_ABUSE, SPAM, PERSONAL_DATA, IRRELEVANT, MANIPULATION_CONFLICT, OTHER] }
        description: { type: string, maxLength: 2000 }
    ModerationReason:
      type: object
      required: [reason]
      additionalProperties: false
      properties: { reason: { type: string, minLength: 1, maxLength: 1000 } }
    ProfileCategorySelection:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        is_primary: { type: boolean, default: false }
    ProfileCategoriesUpdate:
      type: object
      required: [categories]
      additionalProperties: false
      properties:
        categories:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/ProfileCategorySelection' }
    ProfileSkillSelection:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        level: { type: string, enum: [BEGINNER, INTERMEDIATE, ADVANCED, EXPERT] }
        years: { type: integer, minimum: 0, maximum: 80 }
        is_featured: { type: boolean, default: false }
    ProfileSkillsUpdate:
      type: object
      required: [skills]
      additionalProperties: false
      properties:
        skills:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ProfileSkillSelection' }
    ProfileLanguage:
      type: object
      required: [code, level]
      additionalProperties: false
      properties:
        code: { type: string, minLength: 2, maxLength: 10 }
        level: { type: string, enum: [BASIC, CONVERSATIONAL, FLUENT, NATIVE] }
    ProfileLanguagesUpdate:
      type: object
      required: [languages]
      additionalProperties: false
      properties:
        languages:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/ProfileLanguage' }
    PortfolioWriteRequest:
      type: object
      required: [title, slug, visibility]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 180 }
        slug: { type: string, minLength: 1, maxLength: 220, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        description: { type: string, maxLength: 5000 }
        external_url: { type: string, format: uri, maxLength: 2048 }
        price_min_kopecks: { type: integer, format: int64, minimum: 0, nullable: true }
        price_max_kopecks: { type: integer, format: int64, minimum: 0, nullable: true }
        completed_on: { type: string, format: date }
        visibility: { type: string, enum: [PUBLIC, PRIVATE] }
        sort_order: { type: integer, minimum: 0, maximum: 10000, default: 0 }
        category_ids: { type: array, maxItems: 10, uniqueItems: true, items: { type: string, format: uuid } }
        skill_ids: { type: array, maxItems: 50, uniqueItems: true, items: { type: string, format: uuid } }
        media_object_ids: { type: array, maxItems: 20, uniqueItems: true, items: { type: string, format: uuid } }
    PortfolioMediaAttachRequest:
      type: object
      required: [media_object_id]
      additionalProperties: false
      properties:
        media_object_id: { type: string, format: uuid }
        sort_order: { type: integer, minimum: 0, maximum: 10000, default: 0 }
    UploadPresignRequest:
      type: object
      required: [purpose, filename, mime_type, size_bytes]
      additionalProperties: false
      properties:
        purpose: { type: string, enum: [PORTFOLIO, SERVICE, PROJECT, CHAT, AVATAR] }
        filename: { type: string, minLength: 1, maxLength: 255 }
        mime_type: { type: string, enum: [image/jpeg, image/png, image/webp, application/pdf] }
        size_bytes: { type: integer, format: int64, minimum: 1, maximum: 20971520 }
    MediaObject:
      type: object
      required: [id, purpose, original_filename, mime_type, size_bytes, scan_status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        purpose: { type: string, enum: [PORTFOLIO, SERVICE, PROJECT, CHAT, AVATAR] }
        original_filename: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer, format: int64 }
        scan_status: { type: string, enum: [PENDING, CLEAN, INFECTED, FAILED] }
        uploaded_at: { type: string, format: date-time }
        download_url: { type: string, format: uri }
        expires_at: { type: string, format: date-time }
    SiteSettings:
      type: object
      required: [project_name, project_description, support_email, support_phone, legal_company_name, footer_copyright, primary_button_color, button_hover_color, green_heading_color, bright_blue_color, heading_color, body_text_color, page_background_color]
      additionalProperties: false
      properties:
        project_name: { type: string }
        project_description: { type: string }
        support_email: { type: string }
        support_phone: { type: string }
        legal_company_name: { type: string }
        footer_copyright: { type: string }
        primary_button_color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        button_hover_color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        green_heading_color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        bright_blue_color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        heading_color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        body_text_color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        page_background_color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
    ServiceMoney:
      type: object
      required: [amount_kopecks, currency]
      additionalProperties: false
      properties:
        amount_kopecks: { type: integer, format: int64, minimum: 1 }
        currency: { type: string, enum: [RUB] }
    EducationServiceDetails:
      type: object
      required: [format]
      additionalProperties: false
      properties:
        format: { type: string, enum: [ONLINE, OFFLINE, ASYNC, HYBRID] }
        duration_minutes: { type: integer, minimum: 15, maximum: 10080 }
        sessions_count: { type: integer, minimum: 1, maximum: 365 }
        audience_type: { type: string, enum: [INDIVIDUAL, GROUP, BOTH] }
        group_size_max: { type: integer, minimum: 2, maximum: 1000 }
    ServiceCreateRequest:
      type: object
      required: [category_id, service_type, title, slug, description, price_type, visibility]
      additionalProperties: false
