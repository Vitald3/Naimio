openapi: 3.0.3
info:
  title: Professional Services Marketplace API
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: apiHealth
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /auth/register:
    post:
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { description: User created }
        '400': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      operationId: login
      responses:
        '200': { description: Authenticated }
        '401': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      operationId: logout
      responses:
        '204': { description: Logged out }
  /auth/logout-all:
    post:
      operationId: logoutAll
      responses:
        '204': { description: Sessions revoked }
  /auth/session:
    get:
      operationId: currentSession
      responses:
        '200': { description: Current session }
  /auth/verify-email:
    post:
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              additionalProperties: false
              properties: { token: { type: string, minLength: 32, maxLength: 256 } }
      responses: { '200': { description: Email verified }, '422': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/Error' } }
  /auth/resend-verification:
    post:
      operationId: resendEmailVerification
      responses: { '204': { description: Verification message queued if still required }, '401': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/Error' } }
  /site-settings:
    get:
      operationId: publicSiteSettings
      responses:
        '200':
          description: Public project identity and appearance settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SiteSettings' }
  /avatars/{identity}:
    get:
      operationId: publicUserAvatar
      parameters:
        - { name: identity, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 120 } }
      responses:
        '307': { description: Redirect to the clean custom avatar or deterministic placeholder }
        '404': { $ref: '#/components/responses/Error' }
  /presence/{identity}:
    get:
      operationId: publicUserPresence
      parameters:
        - { name: identity, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 160 } }
      responses:
        '200':
          description: Whether the user has an active session recently used on the site
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [online]
                    properties: { online: { type: boolean } }
  /presence/heartbeat:
    post:
      operationId: heartbeatUserPresence
      responses:
        '204': { description: Presence refreshed through the authenticated session }
        '401': { $ref: '#/components/responses/Error' }
  /me:
    get:
      operationId: currentUser
      responses:
        '200': { description: Current user }
    patch:
      operationId: updateCurrentUser
      responses:
        '200': { description: Updated user }
    delete:
      operationId: deleteCurrentUser
      responses:
        '204': { description: Account deleted }
  /me/capabilities/customer:
    put:
      operationId: enableCustomerCapability
      responses:
        '200': { description: Capability enabled }
  /me/capabilities/freelancer:
    put:
      operationId: enableFreelancerCapability
      responses:
        '200': { description: Capability enabled }
  /categories:
    get:
      operationId: listCategories
      responses:
        '200': { description: Category tree }
  /categories/{slug}:
    get:
      operationId: getCategory
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Category }
        '404': { $ref: '#/components/responses/Error' }
  /skills:
    get:
      operationId: searchSkills
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: Skills }
  /admin/categories:
    get:
      operationId: listAdminCategories
      responses: { '200': { description: Full category administration list including inactive items }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' } }
    post:
      operationId: createCategory
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CategoryWrite' } } } }
      responses: { '201': { description: Category created }, '401': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /admin/categories/{id}:
    put:
      operationId: updateCategory
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CategoryWrite' } } } }
      responses: { '200': { description: Category updated }, '401': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /admin/skills:
    get:
      operationId: listAdminSkills
      responses: { '200': { description: Full skill administration list including inactive items }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' } }
    post:
      operationId: createSkill
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SkillWrite' } } } }
      responses: { '201': { description: Skill created }, '401': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /admin/skills/{id}:
    put:
      operationId: updateSkill
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SkillWrite' } } } }
      responses: { '200': { description: Skill updated }, '401': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /admin/dashboard:
    get:
      operationId: adminDashboard
      responses: { '200': { description: Operational admin metrics }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' } }
  /admin/users:
    get:
      operationId: adminListUsers
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: role, in: query, required: false, schema: { type: string } }
        - { name: capability, in: query, required: false, schema: { type: string } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses: { '200': { description: Paginated users }, '403': { $ref: '#/components/responses/Error' } }
  /admin/users/{id}:
    get:
      operationId: adminGetUser
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: User detail }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } }
  /admin/users/{id}/status:
    patch:
      operationId: adminSetUserStatus
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: User status updated }, '403': { $ref: '#/components/responses/Error' } }
  /admin/users/{id}/revoke-sessions:
    post:
      operationId: adminRevokeUserSessions
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: Sessions revoked }, '403': { $ref: '#/components/responses/Error' } }
  /admin/users/{id}/roles/{role}:
    put:
      operationId: adminGrantRole
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: role, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: Role granted }, '403': { $ref: '#/components/responses/Error' } }
    delete:
      operationId: adminRevokeRole
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: role, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: Role revoked }, '403': { $ref: '#/components/responses/Error' } }
  /admin/feature-flags:
    get:
      operationId: adminListFeatureFlags
      responses: { '200': { description: Feature flags }, '403': { $ref: '#/components/responses/Error' } }
  /admin/feature-flags/{key}:
    patch:
      operationId: adminUpdateFeatureFlag
      parameters: [{ name: key, in: path, required: true, schema: { type: string, maxLength: 100 } }]
      responses: { '200': { description: Feature flag updated }, '403': { $ref: '#/components/responses/Error' } }
  /admin/reports:
    get:
      operationId: adminListReports
      responses: { '200': { description: Paginated moderation reports }, '403': { $ref: '#/components/responses/Error' } }
  /admin/reports/{id}/status:
    patch:
      operationId: adminUpdateReport
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Report updated }, '403': { $ref: '#/components/responses/Error' } }
  /admin/fraud-signals:
    get:
      operationId: adminListFraudSignals
      responses: { '200': { description: Paginated fraud signals }, '403': { $ref: '#/components/responses/Error' } }
  /admin/fraud-signals/{id}/status:
    patch:
      operationId: adminUpdateFraudSignal
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Fraud signal updated }, '403': { $ref: '#/components/responses/Error' } }
  /admin/audit:
    get:
      operationId: adminListAudit
      responses: { '200': { description: Paginated immutable audit entries }, '403': { $ref: '#/components/responses/Error' } }
  /admin/projects:
    get:
      operationId: adminListProjects
      responses: { '200': { description: Paginated project moderation list }, '403': { $ref: '#/components/responses/Error' } }
  /admin/projects/{id}/moderation:
    post:
      operationId: adminModerateProject
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Project moderation updated }, '403': { $ref: '#/components/responses/Error' } }
  /admin/services:
    get:
      operationId: adminListServices
      responses: { '200': { description: Paginated service moderation list }, '403': { $ref: '#/components/responses/Error' } }
  /admin/vacancies:
    get:
      operationId: adminListVacancies
      responses: { '200': { description: Paginated vacancy moderation list }, '403': { $ref: '#/components/responses/Error' } }
  /admin/reviews:
    get:
      operationId: adminListReviews
      responses: { '200': { description: Paginated review moderation list }, '403': { $ref: '#/components/responses/Error' } }
  /admin/disputes:
    get:
      operationId: adminListDisputes
      responses: { '200': { description: Paginated Safe Deal disputes }, '403': { $ref: '#/components/responses/Error' } }
  /profiles/{username}:
    get:
      operationId: getPublicProfile
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Public profile }
        '404': { $ref: '#/components/responses/Error' }
  /profiles/{username}/external-reputations:
    get:
      operationId: listPublicExternalReputations
      parameters:
        - { name: username, in: path, required: true, schema: { type: string, maxLength: 40 } }
      responses:
        '200':
          description: Verified external reputation only
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PublicExternalReputation' } }
        '404': { $ref: '#/components/responses/Error' }
  /me/external-reputations:
    get:
      operationId: listMyExternalReputations
      responses:
        '200': { description: Owner external reputations }
        '401': { $ref: '#/components/responses/Error' }
    post:
      operationId: createMyExternalReputation
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExternalReputationCreate' } } } }
      responses:
        '201': { description: External reputation created as UNVERIFIED }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /me/external-reputations/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      operationId: updateMyExternalReputation
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExternalReputationPatch' } } } }
      responses: { '200': { description: Updated unverified external reputation }, '401': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
    delete:
      operationId: deleteMyExternalReputation
      responses: { '204': { description: Deleted }, '401': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } }
  /me/external-reputations/{id}/verification:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      operationId: startExternalReputationVerification
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReputationVerificationStart' } } } }
      responses: { '201': { description: Verification challenge created }, '401': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
    get:
      operationId: getExternalReputationVerification
      responses: { '200': { description: Current verification status }, '401': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } }
  /admin/external-reputations:
    get:
      operationId: listPendingExternalReputations
      parameters: [{ name: status, in: query, required: false, schema: { type: string, enum: [PENDING] } }]
      responses: { '200': { description: Private moderator verification queue }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' } }
  /admin/external-reputations/{id}/verify:
    post:
      operationId: verifyExternalReputation
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReputationDecision' } } } }
      responses: { '200': { description: Verified and audited }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } }
  /admin/external-reputations/{id}/reject:
    post:
      operationId: rejectExternalReputation
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReputationDecision' } } } }
      responses: { '200': { description: Rejected and audited }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /projects/{project_id}/reviews:
    post:
      operationId: createProjectReview
      parameters: [{ name: project_id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewCreate' } } } }
      responses: { '201': { description: Native review created for an eligible completed project }, '401': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /profiles/{username}/reviews:
    get:
      operationId: listPublicProfileReviews
      parameters:
        - { name: username, in: path, required: true, schema: { type: string, maxLength: 40 } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses: { '200': { description: Published native reviews and materialized trust summary }, '404': { $ref: '#/components/responses/Error' } }
  /me/reviews/given:
    get:
      operationId: listMyGivenReviews
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses: { '200': { description: Reviews created by the current actor }, '401': { $ref: '#/components/responses/Error' } }
  /reviews/{id}/reports:
    post:
      operationId: reportReview
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewReport' } } } }
      responses: { '204': { description: Report accepted }, '401': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /admin/reviews/{id}/hide:
    post:
      operationId: hideReview
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ModerationReason' } } } }
      responses: { '200': { description: Review hidden without content editing }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } }
  /admin/reviews/{id}/restore:
    post:
      operationId: restoreReview
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ModerationReason' } } } }
      responses: { '200': { description: Review restored without content editing }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } }
  /freelancers:
    get:
      operationId: listFreelancers
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 120 } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200': { description: Public freelancer cards }
  /me/professional-profile:
    patch:
      operationId: updateProfessionalProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfessionalProfileUpdate' }
      responses:
        '200': { description: Updated profile }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /me/categories:
    put:
      operationId: replaceMyProfileCategories
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileCategoriesUpdate' }
      responses:
        '200': { description: Updated profile categories }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /me/skills:
    put:
      operationId: replaceMyProfileSkills
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileSkillsUpdate' }
      responses:
        '200': { description: Updated profile skills }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /me/languages:
    put:
      operationId: replaceMyProfileLanguages
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileLanguagesUpdate' }
      responses:
        '200': { description: Updated profile languages }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /profiles/{username}/portfolio:
    get:
      operationId: listPublicPortfolio
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200': { description: Public visible portfolio items }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /me/portfolio:
    post:
      operationId: createPortfolioItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortfolioWriteRequest' }
      responses:
        '201': { description: Created portfolio item }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /me/portfolio/{id}:
    get:
      operationId: getMyPortfolioItem
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Owned portfolio item }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateMyPortfolioItem
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortfolioWriteRequest' }
      responses:
        '200': { description: Updated portfolio item }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteMyPortfolioItem
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Portfolio item soft-deleted }
