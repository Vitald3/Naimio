events {}

http {
  server_tokens off;
  gzip on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types application/json text/css application/javascript;

  upstream web { server web:3000; }
  upstream api { server api:8080; }

  server {
    listen 80;
    client_max_body_size 25m;
    # Preserve the public port so same-origin CSRF validation compares the
    # browser Origin with the actual externally visible authority.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

    location = /api/v1/ws {
      proxy_pass http://api;
      proxy_http_version 1.1;
      # proxy_set_header directives in a location replace inherited server
      # directives, so repeat the public authority for same-origin WS checks.
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 70s;
      proxy_send_timeout 70s;
      proxy_buffering off;
    }
    location = /api/v1/admin/support/ws {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 70s;
      proxy_send_timeout 70s;
      proxy_buffering off;
    }
    location /api/ {
      proxy_pass http://api;
      proxy_connect_timeout 5s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
    }
    location /health/ { proxy_pass http://api; proxy_connect_timeout 5s; proxy_read_timeout 5s; }
    location / { proxy_pass http://web; proxy_connect_timeout 5s; proxy_read_timeout 30s; }
  }
}
