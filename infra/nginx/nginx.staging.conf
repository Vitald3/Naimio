events {}
http {
  server_tokens off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  upstream web { server web:3000; }
  upstream api { server api:8080; }
  server { listen 80; server_name _; return 308 https://$host$request_uri; }
  server {
    listen 443 ssl http2;
    server_name _;
    # Mount operator-managed staging TLS files at /etc/nginx/tls.
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 25m;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    location = /api/v1/ws { proxy_pass http://api; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_read_timeout 70s; proxy_buffering off; }
    location /api/ { proxy_pass http://api; }
    location /health/ { proxy_pass http://api; }
    location /_next/static/ { proxy_pass http://web; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location / { proxy_pass http://web; }
  }
}
