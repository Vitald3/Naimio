events {}

http {
  server_tokens off;
  gzip on;
  gzip_min_length 1024;
  gzip_types application/json text/css application/javascript image/svg+xml;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  upstream web { server web:3000; keepalive 32; }
  upstream api { server api:8080; keepalive 64; }

  server { listen 80; server_name naimio.ru www.naimio.ru; return 308 https://naimio.ru$request_uri; }
  server {
    listen 443 ssl http2;
    server_name www.naimio.ru;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    return 308 https://naimio.ru$request_uri;
  }
  server {
    listen 443 ssl http2;
    server_name naimio.ru;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 25m;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' https: data: blob:; media-src 'self' https:; connect-src 'self' wss://naimio.ru https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data: https:; form-action 'self'; upgrade-insecure-requests" always;
    location = /api/v1/ws { proxy_pass http://api; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_read_timeout 70s; proxy_send_timeout 70s; proxy_buffering off; }
    location = /api/v1/admin/support/ws { proxy_pass http://api; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_read_timeout 70s; proxy_send_timeout 70s; proxy_buffering off; }
    location /api/ { proxy_pass http://api; }
    location /health/ { proxy_pass http://api; proxy_read_timeout 5s; }
    location /_next/static/ { proxy_pass http://web; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location / { proxy_pass http://web; }
  }
}
